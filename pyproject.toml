[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "homomorphic-ckks-floating-engine"
version = "2.0.1"
description = "Rule-based metric evaluation demonstrator (not an implementation of CKKS encryption)"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
homomorphic-ckks-floating-engine = "cli:main"
homomorphic-ckks-legacy = "ckks_fhe_engine.cli:main"

[tool.setuptools]
py-modules = ["cli", "enrichment", "simulator", "ckks_fhe_engine_app"]

[tool.setuptools.packages.find]
include = ["agents*", "ckks_fhe_engine*"]

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/homomorphic-ckks-floating-engine"
Repository = "https://github.com/abusuraihsakhri/homomorphic-ckks-floating-engine"
