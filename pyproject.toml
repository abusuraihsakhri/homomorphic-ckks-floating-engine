[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homomorphic-ckks-floating-engine"
version = "2.0.0"
description = "CKKS Homomorphic Encryption Floating-Point Vector Arithmetic Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
homomorphic-ckks-floating-engine = "ckks_fhe_engine.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/homomorphic-ckks-floating-engine"
Repository = "https://github.com/abusuraihsakhri/homomorphic-ckks-floating-engine.git"
